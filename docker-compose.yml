services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
    ports:
      - "8000:8000"
    env_file: .env
    environment:
      - DOMAIN=localhost:8000
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_started
    command: >
      /bin/sh -c "
      echo 'Waiting for database to become ready...';
      timeout 120s sh -c 'until pg_isready -h db -p 5432; do sleep 2; done';
      alembic upgrade head;
      poetry run uvicorn api.__init__:app --host 0.0.0.0 --port 8000
      "

  db:
    image: postgres:15-alpine
    volumes:
      - pg_data:/var/lib/postgresql/data
    environment:
      - POSTGRES_DB=task_db
      - POSTGRES_USER=daniel
      - POSTGRES_PASSWORD=daniel
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB"]
      interval: 5s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7-alpine
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 5

volumes:
  pg_data: